  <g stroke="#141414" stroke-width="5">
    <rect x="420" y="304" width="26" height="26" fill="#6C3FD4"/>
    <rect x="640" y="304" width="26" height="26" fill="#FF4D3D"/>
    <rect x="860" y="304" width="26" height="26" fill="#2ECC71"/>
    <rect x="1080" y="304" width="26" height="26" fill="#FF8A00"/>
    <rect x="1500" y="304" width="26" height="26" fill="#6C3FD4"/>
  </g>
