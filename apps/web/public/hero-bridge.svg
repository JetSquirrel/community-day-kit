  <path d="M0 640 V520 H40 V470 H78 V540 H110 V500 H140 V640 Z" fill="#141414"/>
  <!-- right bank skyline corner -->
  <path d="M1920 640 V500 H1884 V440 H1872 V500 H1830 V480 H1800 V640 Z" fill="#141414"/>
  <!-- water waves under arch -->
  <path d="M620 566 q24 -18 48 0 t48 0 t48 0" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
  <path d="M900 596 q24 -18 48 0 t48 0 t48 0" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
  <path d="M1180 572 q24 -18 48 0 t48 0 t48 0" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
  <!-- the bridge: blue arch -->
  <path d="M120 330 L1800 330 L1800 372 L1740 372 Q960 640 180 372 L120 372 Z" fill="#2B5CE6" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
