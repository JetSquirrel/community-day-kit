    - { id: platinum, name: 铂金赞助, booth: true, talkSlots: 1, logoSize: lg }
    - { id: gold, name: 金牌赞助, booth: true, talkSlots: 1, logoSize: md }
    - { id: silver, name: 银牌赞助, booth: false, talkSlots: 0, logoSize: md }
    - { id: gift, name: 礼品赞助, booth: true, talkSlots: 0, logoSize: sm }
    - { id: community, name: 社区合作伙伴, booth: false, talkSlots: 0, logoSize: sm }

materials:
  photo:
    aspect: [4, 5]
    minWidth: 800
    minHeight: 1000
    maxBytes: 8388608
    guidelines:
      - 竖版 4:5，至少 800×1000 像素（建议 1200×1500 以上），请上传原图，不要截图或微信压缩图
      - 单人照：肩部以上到半身，正面或微侧，头顶留出约一拳空间，不要从合影里裁
      - 对焦清晰、光线均匀，脸部无遮挡（墨镜 / 口罩 / 强逆光）
      - 纯色或简洁背景，与衣服、头发颜色有区分（便于海报抠图）
      - 不带水印、文字、logo、相框或贴纸；避免重度美颜滤镜
  deck:
    templateUrl: https://example.com/replace-with-official-template
    maxBytes: 104857600
    formats: [pptx, pdf]
    maxSlidesPerMinute: 1.5
    templateMarkers: [Community Day]
    flaggedTerms: [Azure, Google Cloud, GCP, 阿里云, 腾讯云, 华为云, 火山引擎, 百度智能云]
    rules:
      - 使用官方模板：首页含活动名、讲题、讲者姓名与职位，末页为致谢 / 联系方式页
      - 页数与时长匹配：每分钟不超过 1.5 页（25 分钟 ≈ 不超过 38 页）
      - 可读性：正文字号不小于 18pt，单页文字不超过约 6 行；代码截图需在投影上可读
      - 中立性：标题与正文避免出现与亚马逊云科技存在竞争关系的云平台品牌；确需对比时保持客观并提前告知组委会
      - 推广克制：公司 / 产品介绍不超过 1 页（赞助商专场除外），不放招聘或二维码广告墙
      - 合规：不含个人隐私、客户敏感数据、内部机密及未授权的图片 / 字体
      - 一致性：PPT 标题与已提交的议题一致，如需修改请先告知组委会
      - 国际讲者 / 国际听众场次请提供英文或双语版本

